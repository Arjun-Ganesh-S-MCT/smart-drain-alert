name: Android APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install app deps (fonts + Leaflet into src/vendor)
        run: npm install --ignore-scripts && node scripts/copy-fonts.js
      - name: Android project
        working-directory: android-app
        run: |
          npm install
          node prepare-web.js
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android
      - name: Allow plain ws:// to the ESP32 and set permissions
        working-directory: android-app/android/app/src/main
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' AndroidManifest.xml
          grep -q 'ACCESS_NETWORK_STATE' AndroidManifest.xml || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />|' AndroidManifest.xml
      - name: Plain launch background (no default logo flash before the intro)
        working-directory: android-app/android/app/src/main/res
        run: |
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="fb_launch">#e0d9d3</color></resources>\n' > values/fb_colors.xml
          sed -i 's|@drawable/splash|@color/fb_launch|' values/styles.xml
      - name: Small release build (shrunk, Android 5.1 and newer)
        working-directory: android-app/android/app
        run: |
          printf '\nandroid {\n  buildTypes {\n    release {\n      minifyEnabled true\n      shrinkResources true\n      signingConfig signingConfigs.debug\n    }\n  }\n}\n' >> build.gradle
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the file
        run: cp android-app/android/app/build/outputs/apk/release/app-release.apk FlowBeacon.apk
      - uses: actions/upload-artifact@v4
        with: { name: FlowBeacon-apk, path: FlowBeacon.apk }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: FlowBeacon.apk }
