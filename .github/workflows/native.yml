name: Build native apps
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libpulse-mainloop-glib0
      - name: Logic tests
        run: python -m unittest discover -s tests
      - name: Build
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlowBeacon-${{ runner.os }}
          path: desktop/dist/FlowBeacon

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk FlowBeacon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlowBeacon-Android
          path: FlowBeacon.apk
