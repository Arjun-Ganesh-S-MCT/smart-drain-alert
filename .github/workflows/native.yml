name: Build native apps
on:
  push:
    branches: [main]
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (Windows, for the .msi installer)
        if: runner.os == 'Windows'
        run: pip install -r requirements-msi.txt
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: pip install -r requirements.txt
      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libpulse-mainloop-glib0
      - name: Logic tests
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Build Windows installer (.msi)
        if: runner.os == 'Windows'
        run: python build_msi.py
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FlowBeacon-Windows-msi
          path: desktop/dist/*.msi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: FlowBeacon-Linux
          path: desktop/dist/FlowBeacon

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk FlowBeacon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlowBeacon-Android
          path: FlowBeacon.apk

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - run: |
          mkdir release
          cp out/FlowBeacon-Windows-msi/*.msi release/
          cp out/FlowBeacon-Android/FlowBeacon.apk release/
          tar -czf release/FlowBeacon-Linux.tar.gz -C out/FlowBeacon-Linux .
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
